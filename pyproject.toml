[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "instonge-redteamcover"
version = "0.1.0"
description = "把攻击面清单与红队用例对照，标出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "instonge" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://instonge.github.io"
Repository = "https://github.com/instonge/redteamcover"
Issues = "https://github.com/instonge/redteamcover/issues"

[project.scripts]
redteamcover = "redteamcover:main"

[tool.setuptools]
py-modules = ["redteamcover"]
